apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  selector: { app: vote }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  selector: { app: result }
  ports:
    - name: http
      port: 80
      targetPort: 4000
