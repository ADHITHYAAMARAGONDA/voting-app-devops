apiVersion: v1
kind: ConfigMap
metadata:
  name: voting-config
  namespace: voting
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: voting-app
data:
  # Non-secret runtime settings for the application tier.
  # These values are safe to expose because they are service names and feature flags.
  OPTION_A: "Cats"
  OPTION_B: "Dogs"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  APP_PORT: "80"
  RESULT_PORT: "4000"
