apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: voting
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: voting-app
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP